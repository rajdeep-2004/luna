 .brush{transform-origin:0 0;animation:brush 6s ease-out infinite}
 @keyframes brush{0%{transform:scaleY(0)}35%,92%{transform:scaleY(1)}100%{transform:scaleY(1)}}
 .ink{animation:ink 6s ease-out infinite}
 @keyframes ink{0%,90%{opacity:1}100%{opacity:0}}
 .seal{transform-origin:742px 330px;animation:seal 6s ease-out infinite}
 @keyframes seal{0%,38%{opacity:0;transform:scale(1.6) rotate(-6deg)}44%,92%{opacity:1;transform:scale(1) rotate(-6deg)}100%{opacity:0;transform:scale(1) rotate(-6deg)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
