<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Luna: a cut-paper dojo at night. The moon drifts past a shoji window, a paper lantern swings, and the kanji 月 is brushed in.">
<style>
 .moon{animation:drift 14s ease-in-out infinite alternate}
 @keyframes drift{from{transform:translate(0,10px)}to{transform:translate(150px,-8px)}}
 .tw{animation:tw 3s ease-in-out infinite}
 @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
 .swing{transform-origin:1196px 0;animation:swing 4.5s ease-in-out infinite}
 @keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
 .glow{animation:flick 2.2s ease-in-out infinite}
